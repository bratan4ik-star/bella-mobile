name: Bella Finance APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bella-android/**'
      - '.github/workflows/bella-android.yml'

# Мінімальні права токена: workflow лише читає код і вивантажує артефакт.
permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bella-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bella-android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android

      - name: Збірка debug APK
        working-directory: bella-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bella-finance-debug-apk
          path: bella-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

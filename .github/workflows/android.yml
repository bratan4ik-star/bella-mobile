name: Збірка APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  apk:
    needs: test
    # Збірка запускається, коли у змінних репозиторію задано ANDROID_CLIENT_ID (див. README).
    if: github.event_name != 'pull_request' && vars.ANDROID_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ключ підпису з секретів
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Немає секрету KEYSTORE_BASE64. Додайте секрети (Settings → Secrets and variables → Actions), див. README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"

      - name: Збірка
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_CLIENT_ID: ${{ vars.ANDROID_CLIENT_ID }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/signing.jks"
          ./android/build.sh

      - name: Видалити ключ з диска
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: fin-manager-apk
          path: android/build/fin-manager.apk
          if-no-files-found: error
          retention-days: 30
